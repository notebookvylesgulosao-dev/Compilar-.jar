
name: Enviar arquivos do WandryHP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enviar:
    runs-on: ubuntu-latest

    steps:
      - name: Acessar repositório
        uses: actions/checkout@v4

      - name: Baixar ZIP do Drive
        run: |
          pip install gdown
          gdown "https://drive.google.com/uc?id=1OjiC3Wqq_u_L1cZ5ViNhsmmSxig5glGl" -O wandry.zip

      - name: Extrair arquivos
        run: |
          mkdir projeto
          unzip -q wandry.zip -d projeto
          PROJECT_DIR="$(dirname "$(find projeto -name build.gradle -print -quit)")"
          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "projeto" ]; then
            PROJECT_DIR="projeto"
          fi
          rsync -a --exclude='.git' --exclude='.github' "$PROJECT_DIR"/ ./

      - name: Enviar arquivos ao GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Adicionar arquivos do WandryHP"
            git push
          fi
concurrency:
