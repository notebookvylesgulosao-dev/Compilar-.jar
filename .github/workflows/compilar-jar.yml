name: Compilar WandryHP

on:
  workflow_dispatch:
  push:
    paths:
      - 'WandryHP-projeto-corrigido.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Extrair projeto
        run: unzip -q WandryHP-projeto-corrigido.zip
      - name: Compilar
        working-directory: WandryHP
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace
      - name: Enviar JAR
        uses: actions/upload-artifact@v4
        with:
          name: wandryhp-jar
          path: WandryHP/build/libs/*.jar
